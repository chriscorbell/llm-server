# Qwen3.8-27B on one Intel Arc Pro B70. See ../STATUS.md for what is current.
#
# One Profile runs at a time; the GPU holds one model.
#   bash scripts/compose.sh --profile a-int4draft up -d
#   bash scripts/compose.sh --profile original-int4draft up -d
#
# Private .env values are followed by model.env and measured tuning.env defaults.

x-b70-common: &b70-common
  image: ${VLLM_IMAGE}
  container_name: qwen38
  restart: unless-stopped
  # Bound to the Tailscale address only. Never publish on 0.0.0.0.
  ports:
    - "${BIND_ADDR}:${PORT}:8000"
  devices:
    - /dev/dri:/dev/dri
  group_add:
    - "${RENDER_GID}"
  ipc: host
  shm_size: "8gb"
  # The engine core loop is a single hot thread. Pinning it inside one CCX keeps it
  # on one L3 slice instead of migrating across the eight on this Threadripper.
  # Empty means unpinned, which is the default.
  cpuset: "${CPUSET:-}"
  environment:
    VLLM_TARGET_DEVICE: xpu
    ZE_FLAT_DEVICE_HIERARCHY: COMPOSITE
    ZE_AFFINITY_MASK: "0"
    # Level Zero refuses single allocations over 4 GiB by default. The KV cache
    # exceeds that at long context, so this is required, not optional.
    UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
    B70_MTP_BF16_DRAFT: "1"
    B70_DRAFT_LMHEAD_INT4: "1"
    B70_DRAFT_MTP_INT4: "1"
    VLLM_XPU_ENABLE_XPU_GRAPH: "1"
    PYTORCH_ALLOC_CONF: expandable_segments:True
    VLLM_API_KEY: ${API_KEY}
    HF_HOME: /tmp/hf
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
    interval: 30s
    timeout: 5s
    start_period: 600s
    retries: 3
  entrypoint:
    - bash
    - -lc
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-int4draft: &int4draft
  <<: *b70-common
  command:
    - >-
      set -e;
      python /patches/patch_mtp_nightly.py;
      python /patches/patch_mtp_boundary.py;
      python /patches/patch_draft_lmhead_int4.py;
      python /patches/patch_draft_mtp_int4.py;
      exec vllm serve /model
      --served-model-name ${SERVED_NAME}
      --quantization gptq
      --dtype float16
      --kv-cache-dtype ${KV_DTYPE:-auto}
      --max-model-len ${MAX_MODEL_LEN_INT4DRAFT}
      --gpu-memory-utilization ${GPU_UTIL}
      --max-num-seqs ${MAX_NUM_SEQS}
      --max-num-batched-tokens ${MAX_BATCHED_TOKENS}
      --enable-prefix-caching
      --enable-prompt-tokens-details
      --enable-auto-tool-choice
      --tool-call-parser ${TOOL_PARSER}
      --reasoning-parser ${REASONING_PARSER}
      --speculative-config '{"method":"mtp","num_speculative_tokens":${MTP_TOKENS}}'
      --port 8000

services:
  # Self-hosted metasearch for Pi's web_search tool. No profile, so it runs
  # alongside whichever model is up. JSON is available at
  # ${BIND_ADDR}:${SEARXNG_PORT}/search?format=json.
  searxng:
    image: ${SEARXNG_IMAGE}
    container_name: searxng
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://${BIND_ADDR}:${SEARXNG_PORT:-8080}/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # Daily driver: kernelogic's abliterated checkpoint with FP8 KV, runtime INT4
  # draft, MTP4, vision, tools and a 131,072-token window.
  vllm-a-int4draft:
    <<: *int4draft
    profiles: ["a-int4draft"]
    volumes:
      # The device mapping above exposes the nodes but not the directory listing.
      # oneCCL enumerates /dev/dri at startup and dies without this bind mount.
      - /dev/dri:/dev/dri:ro
      - ${UNCENSORED_MODEL_DIR}:/model:ro
      - ./patches/patch_mtp_nightly.py:/patches/patch_mtp_nightly.py:ro
      - ./patches/patch_mtp_boundary.py:/patches/patch_mtp_boundary.py:ro
      - ./patches/patch_gdn_mixed_split_v5.py:/patches/patch_gdn_mixed_split_v5.py:ro
      - ./patches/patch_draft_lmhead_int4.py:/patches/patch_draft_lmhead_int4.py:ro
      - ./patches/patch_draft_mtp_int4.py:/patches/patch_draft_mtp_int4.py:ro
      - ${HF_CACHE:-./.hf-cache}:/tmp/hf

  # The checkpoint that preceded the abliterated model. It deliberately uses the
  # same serving flags, so the only profile difference is the model directory.
  vllm-original-int4draft:
    <<: *int4draft
    profiles: ["original-int4draft"]
    volumes:
      - /dev/dri:/dev/dri:ro
      - ${ORIGINAL_MODEL_DIR}:/model:ro
      - ./patches/patch_mtp_nightly.py:/patches/patch_mtp_nightly.py:ro
      - ./patches/patch_mtp_boundary.py:/patches/patch_mtp_boundary.py:ro
      - ./patches/patch_gdn_mixed_split_v5.py:/patches/patch_gdn_mixed_split_v5.py:ro
      - ./patches/patch_draft_lmhead_int4.py:/patches/patch_draft_lmhead_int4.py:ro
      - ./patches/patch_draft_mtp_int4.py:/patches/patch_draft_mtp_int4.py:ro
      - ${HF_CACHE:-./.hf-cache}:/tmp/hf
